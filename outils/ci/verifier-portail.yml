name: "Portail — contrôles"

# Ce que ces contrôles attrapent, et qui est déjà arrivé :
#  · une accolade oubliée dans index.html — la page ne s'affiche plus du tout,
#    et on ne le voit qu'en ouvrant le portail ;
#  · une option permutée dans un support sans changer la bonne réponse en base
#    — le quiz note faux, et personne ne s'en aperçoit avant les résultats ;
#  · un bloc de rattrapage qui a cessé de suivre son insert — au rejeu suivant
#    de la migration, les anciennes options reviennent, en silence ;
#  · une trace de séance sans sa liste de concepts — le débriefing de fin
#    d'heure et le contrôle d'entrée de la séance d'après n'ont plus de source.
#
# La logique vit dans `outils/`, pas dans ce fichier : elle s'exécute à
# l'identique en local, avant de pousser —
#
#     git clone --depth 1 https://github.com/ggaillard/BTS1_S1_B1_DEV /tmp/support
#     python3 outils/controler.py fiche     --supports /tmp/support
#     python3 outils/controler.py pedagogie --supports /tmp/support
#     python3 outils/controler.py coherence --supports /tmp/support
#     python3 outils/essai.py               --supports /tmp/support
#
# Un contrôle qu'on ne peut pas rejouer chez soi est un contrôle qu'on finit
# par contourner.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      # js/ et styles/ n'étaient PAS dans cette liste : elle a été écrite quand
      # tout vivait dans index.html, et les étapes A2 et A3 ont sorti le code
      # sans que personne n'y revienne. Conséquence : une modification d'un
      # module ou d'une feuille — c'est-à-dire la quasi-totalité du travail
      # depuis le 16/09 — ne déclenchait aucun contrôle. Trouvé le 17/09, en
      # relisant ce fichier pour une autre raison.
      - "js/**"
      - "styles/**"
      - "outils/**"
      - "supabase/migrations/**"
      - ".github/workflows/verifier-portail.yml"
  pull_request:
  workflow_dispatch:
  # Les traces vivent dans l'autre dépôt : une séance retouchée là-bas ne
  # déclenche rien ici. Le passage de nuit rattrape ce cas.
  schedule:
    - cron: "17 4 * * *"

jobs:
  syntaxe:
    name: "🧩 Le script du portail se charge-t-il ?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: "Le script se lit-il, et d'où vient-il ?"
        run: |
          # Depuis l'étape A3 de REFONTE.md le script vit dans js/, plus dans
          # un bloc <script>. outils/source.py est le seul endroit qui sait où,
          # pour que le découpage à venir ne rende aucun contrôle muet.
          python3 outils/source.py
          python3 -c "import sys; sys.path.insert(0,'outils'); import io, source; io.open('/tmp/portail.js','w',encoding='utf-8').write(source.script())"
          node --check /tmp/portail.js
          echo "Syntaxe correcte."

      - name: "Chaque module reste-t-il lisible d'une traite ?"
        run: |
          # §6.1 de REFONTE.md : un module, un sujet, 700 lignes au plus. Le
          # plafond qui FAIT ÉCHOUER est celui d'outils/mesurer.mjs, dans le
          # travail « gabarits » ; cette étape-ci ne fait que montrer la liste,
          # pour qu'un module qui grossit se voie avant d'atteindre la limite.
          # (Le chiffre était 400 dans la première écriture du plan, posé au
          # jugé : le premier module sorti en faisait 646 d'un seul tenant et
          # cohérent. §6.1 raconte pourquoi il est passé à 700.)
          python3 - <<'PY'
          import os
          if os.path.isdir('js'):
              for f in sorted(os.listdir('js')):
                  if not f.endswith('.js'):
                      continue
                  n = open(os.path.join('js', f), encoding='utf-8').read().count(chr(10)) + 1
                  print('  js/%-22s %5d lignes %s' % (f, n, '(au-dessus de 700)' if n > 700 else ''))
          PY

      - name: "Les identifiants référencés existent-ils dans la page ?"
        run: |
          python3 - <<'PY'
          import io, re, sys
          sys.path.insert(0, 'outils')
          import source
          bloc = source.script()
          page = source.balisage()
          declares = set(re.findall(r'id="([^"]+)"', page))
          # $("machin") : le raccourci du portail vers getElementById
          utilises = set(re.findall(r'\$\("([^"]+)"\)', bloc))
          manquants = sorted(u for u in utilises if u not in declares)
          if manquants:
              sys.exit("Identifiants utilisés mais absents de la page :\n  " + "\n  ".join(manquants))
          print(len(utilises), "identifiants utilisés, tous présents.")
          PY

      - name: "Toute fonction appelée existe-t-elle encore ?"
        run: |
          python3 - <<'PY'
          # node --check ne voit pas une fonction disparue : la syntaxe reste
          # valide et l'erreur n'arrive qu'au clic, en séance. Le 08/09, un
          # découpage a emporté sept fonctions — repondreAppel, proposerHumeur,
          # texteEnvoi… — sans qu'aucun contrôle ne s'en aperçoive.
          import io, re, sys
          sys.path.insert(0, 'outils')
          import source
          js = source.script()

          def nettoyer(t):
              """Retire commentaires et chaînes : sinon un nom de RPC entre
              guillemets ou un mot français suivi d'une parenthèse passe pour
              un appel."""
              out, i, n = [], 0, len(t)
              while i < n:
                  c = t[i]
                  if c == '/' and i + 1 < n and t[i+1] == '/':
                      j = t.find('\n', i); i = n if j < 0 else j
                  elif c == '/' and i + 1 < n and t[i+1] == '*':
                      j = t.find('*/', i); i = n if j < 0 else j + 2
                  elif c in '"\'`':
                      j = i + 1
                      while j < n and t[j] != c:
                          j += 2 if t[j] == '\\' else 1
                      out.append('""'); i = j + 1
                  else:
                      out.append(c); i += 1
              return ''.join(out)

          code = nettoyer(js)
          definies = set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', code))
          declarees = set(re.findall(r'\b(?:var|let|const)\s+([A-Za-z_$][\w$]*)', code))
          params = set()
          for b in re.findall(r'function\s*[A-Za-z_$\w]*\s*\(([^)]*)\)', code):
              params |= {x.strip() for x in b.split(',') if x.strip()}
          natifs = set("""Array Object String Number Boolean Date Math JSON RegExp Error
          Promise Set Map parseInt parseFloat isNaN encodeURIComponent decodeURIComponent
          setTimeout clearTimeout setInterval clearInterval requestAnimationFrame fetch
          console document window localStorage sessionStorage navigator location history
          AudioContext webkitAudioContext if for while switch catch typeof return function
          new delete void in of do else try finally throw case break continue
          instanceof
          Event CustomEvent KeyboardEvent MouseEvent URL URLSearchParams Intl
          AbortController performance structuredClone queueMicrotask""".split())
          appelees = set(re.findall(r'(?<![\w$.])([A-Za-z_$][\w$]*)\s*\(', code))
          manquantes = sorted(n for n in appelees if n not in definies
                              and n not in declarees and n not in params and n not in natifs)
          if manquantes:
              sys.exit("Fonctions appelées mais absentes :\n  " + "\n  ".join(manquantes))
          print(len(definies), "fonctions définies,", len(appelees),
                "appels distincts, aucun dans le vide.")
          PY

      - name: "Une fonction est-elle déclarée deux fois ?"
        run: |
          python3 - <<'PY'
          # Deux déclarations du même nom : la seconde écrase la première, en
          # silence, et le code qui tourne n'est pas celui qu'on relit. C'est le
          # piège de preflight_seance() côté SQL, transpose au portail — et il
          # s'est produit le 15/09 en réécrivant caseClasse().
          #
          # Seules les DÉCLARATIONS comptent : « (function pas(t){...}) » est une
          # expression nommée, son nom ne vit qu'à l'intérieur d'elle-même, et le
          # portail en a deux qui s'appellent « pas ».
          import io, re, sys
          from collections import Counter
          sys.path.insert(0, 'outils')
          import source
          js = source.script()

          def nettoyer(t):
              out, i, n = [], 0, len(t)
              while i < n:
                  c = t[i]
                  if c == '/' and i + 1 < n and t[i+1] == '/':
                      j = t.find(chr(10), i); i = n if j < 0 else j
                  elif c == '/' and i + 1 < n and t[i+1] == '*':
                      j = t.find('*/', i); i = n if j < 0 else j + 2
                  elif c in "\"'`":
                      j = i + 1
                      while j < n and t[j] != c:
                          j += 2 if t[j] == chr(92) else 1
                      out.append('""'); i = j + 1
                  else:
                      out.append(c); i += 1
              return ''.join(out)

          motif = r"(?<![\w$.()=:,])\bfunction\s+([A-Za-z_$][\w$]*)\s*\("
          decl = re.findall(motif, nettoyer(js))
          dbl = sorted(n for n, k in Counter(decl).items() if k > 1)
          if dbl:
              sys.exit("Fonctions declarees deux fois — la seconde ecrase la "
                       "premiere :" + chr(10) + "  " + (chr(10) + "  ").join(dbl))
          print(len(decl), "declarations, toutes uniques.")
          PY

  gabarits:
    name: "📐 Les écrans tiennent-ils encore ?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: "REFONTE.md décrit-il encore le dépôt ?"
        run: node outils/mesurer.mjs

      - name: "Installer Chromium"
        run: npm i playwright && npx playwright install --with-deps chromium

      # Ces contrôles ouvrent le portail SERVI par outils/serveur.mjs, comme
      # GitHub Pages le sert : c'est la seule façon de résoudre les feuilles de
      # styles/ et le module de js/. Ils échouent bruyamment si la police ne se
      # charge pas — une hauteur mesurée sans IBM Plex ne veut rien dire, et un
      # plafond comparé à une telle mesure encore moins.
      # Celui-ci d'abord : si la page ne se charge pas, les huit autres
      # mesureraient un portail vide en poussant eux-mêmes leurs données, et
      # passeraient au vert.
      - name: "La page se charge-t-elle, sous un préfixe comme en production ?"
        run: node outils/t_chargement.mjs
      - name: "La carte d'appel"
        run: node outils/t_appel.mjs
      - name: "La carte de révision"
        run: node outils/t_revision.mjs
      - name: "« Ce qui bloque » et les Questionnaires"
        run: node outils/t_pilotage.mjs
      - name: "Le mode classe répond-il à ses boutons ?"
        run: node outils/t_ecran.mjs
      - name: "Un message venu de la base reste un message"
        run: node outils/t_messages.mjs
      - name: "Se retrouver : l'adresse, les onglets, les annonces"
        run: node outils/t_navigation.mjs
      - name: "Le tableau de bord d'une séance, lu debout"
        run: node outils/t_suivi.mjs
      # Le seul écran que trente personnes ouvrent en même temps, et le dernier
      # à être passé sous mesure : il n'était vérifié par rien jusqu'au 17/09.
      - name: "L'espace de l'étudiant, sur son téléphone"
        run: node outils/t_etudiant.mjs

  coherence:
    name: "🔗 La page et la base disent-elles la même chose ?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/ggaillard/BTS1_S1_B1_DEV.git /tmp/support
      - run: python3 outils/controler.py coherence --supports /tmp/support

  fiche:
    name: "📋 La fiche — ce qu'une trace doit porter pour exister"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/ggaillard/BTS1_S1_B1_DEV.git /tmp/support
      - run: python3 outils/controler.py fiche --supports /tmp/support

  pedagogie:
    name: "🎓 Les conditions matérielles de la compréhension"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/ggaillard/BTS1_S1_B1_DEV.git /tmp/support
      - run: python3 outils/controler.py pedagogie --supports /tmp/support

  essai:
    name: "🧪 Les contrôles voient-ils encore ce qu'ils prétendent voir ?"
    runs-on: ubuntu-latest
    # Un contrôle qui n'a jamais échoué n'a jamais rien vérifié. Deux cas réels :
    # le contrôle de boucle narrative cherchait des jetons d'au moins trois
    # lettres et ne trouvait rien dans « 03 h 47 » ; le contrôle de vocabulaire
    # comparait le quiz à un corpus qui contenait le quiz. Tous deux au vert,
    # tous deux aveugles. Ce job casse quatorze fois, exprès.
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/ggaillard/BTS1_S1_B1_DEV.git /tmp/support
      - run: python3 outils/essai.py --supports /tmp/support
