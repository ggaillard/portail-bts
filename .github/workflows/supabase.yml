name: "Base — appliquer les migrations"

# Ce qui part sur GitHub part sur Supabase. C'est tout l'intérêt, et c'est
# aussi le risque : une migration poussée s'applique à la base de production,
# celle où travaillent 44 étudiants.
#
# Trois garde-fous :
#  · seules les migrations déclenchent le workflow, pas un changement de page ;
#  · « verifier » passe avant « appliquer » — une migration qui ne rejoue pas
#    proprement sur une base neuve n'atteint jamais la production ;
#  · l'environnement « production » permet d'exiger une approbation manuelle
#    (Settings → Environments → production → Required reviewers).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false      # jamais interrompre une migration en cours

jobs:

  # ── 1. Rejouer la chaîne entière sur une base neuve, deux fois ───────────
  #  Deux fois, parce qu'une migration qui passe une fois et échoue la
  #  seconde n'est pas idempotente — et ces scripts sont faits pour être
  #  rejoués. C'est ce test qui aurait attrapé les liens de projets dupliqués.
  verifier:
    name: "🧪 Les migrations rejouent-elles proprement ?"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

    env:
      PGPASSWORD: postgres
      PSQL: "psql -h localhost -U postgres -d essai -v ON_ERROR_STOP=1 -q"

    steps:
      - uses: actions/checkout@v5

      - name: "🏗️ Base d'essai — le socle historique, posé à la main"
        run: |
          psql -h localhost -U postgres -d postgres -c "create database essai"
          $PSQL <<'SQL'
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select '11111111-1111-1111-1111-111111111111'::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end $$;
          create table classes  (id bigserial primary key, code text unique not null, nom text, annee text);
          create table eleves   (id bigserial primary key, classe_id bigint references classes(id) on delete cascade,
                                 numero text, avatar text, auth_id uuid, vu_le timestamptz);
          create table seances  (id bigserial primary key, classe_id bigint references classes(id) on delete cascade,
                                 numero int, titre text, notee boolean default false, ouverte boolean default false);
          create table corriges (id bigserial primary key, seance_id bigint references seances(id) on delete cascade,
                                 question text, bonne_reponse text, explication text);
          create table reponses (id bigserial primary key, eleve_id bigint references eleves(id) on delete cascade,
                                 seance_id bigint references seances(id) on delete cascade,
                                 question text, reponse text, correct boolean, updated_at timestamptz default now());
          create table enseignants (id bigserial primary key, auth_id uuid);
          create or replace function public.est_enseignant() returns boolean language sql stable
            as $$ select true $$;
          -- Les deux vraies classes, et de quoi que les migrations aient prise
          insert into classes (code, nom, annee) values
            ('BTS1-DEV-2026','BTS SIO 1 - Bloc 1 DEV','2026-2027'),
            ('BTS2-SLAM-2026','BTS SIO 2 - SLAM','2026-2027');
          insert into eleves (classe_id, numero)
            select c.id, lpad(g::text,2,'0') from classes c, generate_series(1,31) g
             where c.code='BTS1-DEV-2026';
          insert into eleves (classe_id, numero)
            select c.id, lpad(g::text,2,'0') from classes c, generate_series(1,13) g
             where c.code='BTS2-SLAM-2026';
          insert into seances (classe_id, numero, titre, notee, ouverte)
            select c.id, g, 'TP'||g, false, true from classes c, generate_series(0,4) g
             where c.code='BTS2-SLAM-2026';
          SQL

      - name: "▶️ Premier passage"
        run: for f in supabase/migrations/*.sql; do echo "── $f"; $PSQL -f "$f" >/dev/null; done

      - name: "🔁 Second passage — l'idempotence est la vraie exigence"
        run: for f in supabase/migrations/*.sql; do echo "── $f"; $PSQL -f "$f" >/dev/null; done

      - name: "🔎 Rien n'a été dupliqué"
        run: |
          $PSQL -c "
          do \$\$
          declare n int;
          begin
            select count(*) into n from projets p join classes c on c.id=p.classe_id
             where c.code='BTS2-SLAM-2026';
            if n <> 2 then raise exception 'projets BTS2 = %, attendu 2 — une insertion n''est pas idempotente', n; end if;

            select count(*) into n from corriges co join seances s on s.id=co.seance_id
              join classes c on c.id=s.classe_id where c.code='BTS1-DEV-2026' and s.numero in (1,2);
            if n <> 20 then raise exception 'corriges BTS1 seances 1-2 = %, attendu 20', n; end if;

            select count(*) into n from seances s join classes c on c.id=s.classe_id
             where c.code='BTS1-DEV-2026' and s.numero between 1 and 14;
            if n <> 14 then raise exception 'seances BTS1 1-14 = %, attendu 14', n; end if;

            -- Le pré-vol doit annoncer 31 étudiants, pas 32 : le compte
            -- d'essai n° 99 n'en est pas un. preflight_seance() est définie
            -- DEUX fois — seance.sql puis projet.sql — et la seconde écrasait
            -- le filtre de la première sans que rien ne le dise. Ce contrôle
            -- existe pour que cela ne puisse plus arriver en silence.
            select (preflight_seance(s.id)->>'eleves')::int into n
              from seances s join classes c on c.id=s.classe_id
             where c.code='BTS1-DEV-2026' and s.numero=1;
            if n <> 31 then raise exception 'effectif du pre-vol BTS1 = %, attendu 31 (le compte n° 99 est-il compte ?)', n; end if;

            -- Et « À faire » doit se taire sur une base saine : si elle crie
            -- alors que tout va bien, on cessera de la lire.
            select ((a_faire()->>'bloquants')::int + (a_faire()->>'attentions')::int) into n;
            if n <> 0 then raise exception 'a_faire() signale % point(s) sur une base saine', n; end if;
          end \$\$;"
          echo "Chaîne rejouable, effectifs conformes."

  # ── 2. Appliquer sur la vraie base ──────────────────────────────────────
  appliquer:
    name: "🚀 Appliquer sur Supabase"
    needs: verifier
    runs-on: ubuntu-latest
    environment: production        # permet d'exiger une approbation manuelle

    steps:
      - uses: actions/checkout@v5

      # ── Dire tout de suite ce qui manque ────────────────────────────────
      #  Sans ce contrôle, un secret absent donne « Access token not provided »
      #  au milieu d'une sortie de CLI, et un « -p "" » qu'il faut avoir l'œil
      #  pour repérer. C'est exactement ce qui s'est passé au premier essai.
      - name: "🔑 Les deux secrets sont-ils là ?"
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MDP:   ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          manque=""
          [ -z "$JETON" ] && manque="$manque  · SUPABASE_ACCESS_TOKEN — Supabase → Account → Access Tokens\n"
          [ -z "$MDP" ]   && manque="$manque  · SUPABASE_DB_PASSWORD — Settings → Database → Database password\n"
          if [ -n "$manque" ]; then
            echo "::error title=Secrets manquants::Le dépôt n'a pas les secrets nécessaires"
            printf "\nSecret(s) absent(s) ou vide(s) :\n%b\n" "$manque"
            echo "À créer dans Settings → Secrets and variables → Actions du dépôt,"
            echo "puis relancer ce workflow (bouton « Run workflow »)."
            exit 1
          fi
          echo "Les deux secrets sont présents."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Le mot de passe passe par l'environnement et non par -p : il n'apparaît
      # alors dans aucune ligne de commande, même tronquée, même en cas d'erreur.
      - name: "🔗 Lier le projet"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref pjuymnnblbydpjlpnoeh

      - name: "📋 Ce qui va être appliqué"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: "🚀 Appliquer"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: "✅ État après"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
